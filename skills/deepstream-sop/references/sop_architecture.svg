="middle">topic: mdx-vlm-captions · JSON | NvProtoSchema</text><text x="555" y="436" fill="#888" font-size="6" text-anchor="middle">via create_producer()</text><line x1="338" x2="440" y1="461" y2="420" stroke="#b88a00" stroke-dasharray="3 2" stroke-width=".8" marker-end="url(#am)"/><g transform="translate(752,38)"><text x="72" y="8" fill="#444" font-size="9" font-weight="bold" text-anchor="middle">Output</text><rect width="128" height="28" x="8" y="14" fill="#fff" stroke="#76b900" stroke-width="1.2" rx="3"/><text x="72" y="28" fill="#333" font-size="8" font-weight="bold" text-anchor="middle">SSE Stream</text><text x="72" y="38" fill="#666" font-size="6" text-anchor="middle">chat.completion.chunk</text><rect width="128" height="28" x="8" y="48" fill="#fff" stroke="#aaa" stroke-width=".8" rx="3"/><text x="72" y="62" fill="#333" font-size="8" text-anchor="middle">Non-streaming</text><text x="72" y="72" fill="#666" font-size="6" text-anchor="middle">chat.completion</text><rect width="128" height="22" x="8" y="82" fill="#fff" stroke="#aaa" stroke-width=".8" rx="3"/><text x="72" y="97" fill="#333" font-size="7.5" text-anchor="middle">Prometheus (/v1/metrics)</text></g><line x1="736" x2="760" y1="68" y2="60" stroke="#76b900" stroke-width="1.2" marker-end="url(#ag)"/><line x1="736" x2="760" y1="68" y2="78" stroke="#999" stroke-width=".8" marker-end="url(#ad)"/><line x1="736" x2="760" y1="108" y2="114" stroke="#999" stroke-width=".8" marker-end="url(#ad)"/><rect width="148" height="40" x="752" y="400" fill="#fff" stroke="#aaa" stroke-width=".8" rx="3"/><text x="826" y="416" fill="#333" font-size="8" font-weight="bold" text-anchor="middle">Docker Container: kafka</text><text x="826" y="430" fill="#999" font-size="6" text-anchor="middle">(apache/kafka:3.7.0)</text><line x1="670" x2="752" y1="420" y2="420" stroke="#999" stroke-width=".8" marker-end="url(#ad)"/><g transform="translate(148,493)"><text x="0" y="10" fill="#888" font-size="6.5">configs/</text><rect width="110" heigh